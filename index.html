<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Designer App</title>

<!-- Google Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body, html {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* Full Screen App Container with Exact 3D House Background */
.app {
  width: 100vw;
  height: 100vh;
  background: linear-gradient(rgba(0,29,53,0.15), rgba(0,29,53,0.15)),
    url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 16px 12px 24px 12px;
  position: relative;
}

/* Top Navigation Bar */
.nav {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
  padding: 8px 6px;
  background: rgba(15, 23, 42, 0.82);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 24px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
  z-index: 10;
}

.nav button {
  border: 1px solid transparent;
  border-radius: 16px;
  padding: 8px 2px;
  color: #94a3b8;
  background: transparent;
  cursor: pointer;
  font-size: 9.5px;
  font-weight: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: all 0.3s ease;
}

.nav button i {
  font-size: 15px;
}

.nav button.active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
}

.nav button span {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* Spacer to push input bar to the bottom */
.spacer {
  flex: 1;
}

/* Bottom Input Bar */
.input-box {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border-radius: 50px;
  width: 100%;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  z-index: 10;
}

.input-box input[type="text"] {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  font-size: 14px;
  background: transparent;
  color: #1e293b;
  padding: 6px 0;
}

.input-box input::placeholder {
  color: #64748b;
}

.input-box button {
  border: none;
  background: transparent;
  font-size: 18px;
  cursor: pointer;
  padding: 6px;
  color: #475569;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background 0.2s;
}

.input-box button:hover {
  background: rgba(0, 0, 0, 0.05);
}

#send {
  background: #2563eb;
  color: white;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  font-size: 16px;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
}

#send:hover {
  background: #1d4ed8;
}
</style>
</head>

<body>

<div class="app">

  <!-- Top 6-Category Navigation Bar -->
  <nav class="nav">
    <button class="active" onclick="choose(this,'Rooms')">
      <i class="fa-solid fa-house"></i>
      <span>Rooms</span>
    </button>

    <button onclick="choose(this,'Interior & Wall Design')">
      <i class="fa-solid fa-palette"></i>
      <span>Interior</span>
    </button>

    <button onclick="choose(this,'Furniture & Electronics')">
      <i class="fa-solid fa-couch"></i>
      <span>Furniture</span>
    </button>

    <button onclick="choose(this,'Swimming Pools')">
      <i class="fa-solid fa-water-ladder"></i>
      <span>Pools</span>
    </button>

    <button onclick="choose(this,'Car & Bike')">
      <i class="fa-solid fa-car"></i>
      <span>Car & Bike</span>
    </button>

    <button onclick="settings()">
      <i class="fa-solid fa-gear"></i>
      <span>Settings</span>
    </button>
  </nav>

  <div class="spacer"></div>

  <!-- Bottom Input Bar -->
  <div class="input-box">
    <button onclick="document.getElementById('imageFile').click()" title="Add Image">
      <i class="fa-solid fa-plus"></i>
    </button>
    <input type="file" id="imageFile" hidden accept="image/*">

    <input id="prompt" type="text" placeholder="Type to make your dreams">

    <button onclick="voice()" title="Voice Input">
      <i class="fa-solid fa-microphone"></i>
    </button>

    <button id="send" onclick="sendRequest()" title="Send">
      <i class="fa-solid fa-wave-square"></i>
    </button>
  </div>

</div>

<script>
function choose(button, category) {
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  button.classList.add('active');
  document.getElementById('prompt').placeholder = 'Design my ' + category;
}

function settings() {
  alert('DreamSpace Settings');
}

function sendRequest() {
  const text = document.getElementById('prompt').value;
  if (!text.trim()) {
    alert('Please enter your design idea!');
    return;
  }
  alert('Your design request: ' + text);
}

function voice() {
  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Speech) {
    alert('Voice input is not supported in this browser.');
    return;
  }
  const recognition = new Speech();
  recognition.lang = 'en-IN';
  recognition.onresult = function(event) {
    document.getElementById('prompt').value = event.results[0][0].transcript;
  };
  recognition.start();
}
</script>

</body>
</html>
