<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Designer App</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b132b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: auto;
            padding: 10px;
        }

        /* Mobile Phone Container with exact reference image containing the 3D house */
        .phone-frame {
            width: 100%;
            max-width: 390px;
            height: 800px;
            background: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            border: 8px solid #1e293b;
        }

        /* Phone Status Bar at the very top */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px 0 24px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            z-index: 20;
        }

        .status-bar .right-icons {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 11px;
        }

        /* Top Navigation Bar */
        .top-nav {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            margin: 8px 12px 0 12px;
            padding: 6px 4px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow-x: auto;
            scrollbar-width: none;
            flex-shrink: 0;
            z-index: 10;
        }

        .top-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 8.5px;
            font-weight: 500;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 5px 6px;
            border-radius: 14px;
            transition: all 0.3s ease;
            white-space: nowrap;
            gap: 3px;
            flex-shrink: 0;
        }

        .nav-item i {
            font-size: 15px;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .nav-item:hover:not(.active) {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        /* Center Content Indicator / Feedback */
        .content-display {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            margin: auto auto;
            padding: 10px 18px;
            border-radius: 16px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 80%;
            z-index: 5;
        }

        /* Bottom Search / Prompt Input Bar */
        .bottom-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            margin: 0 16px 24px 16px;
            padding: 8px 12px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            gap: 8px;
            flex-shrink: 0;
            z-index: 10;
        }

        .action-btn {
            background: transparent;
            border: none;
            font-size: 16px;
            color: #475569;
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .action-btn:hover {
            background: rgba(0, 0, 0, 0.06);
        }

        .input-field {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 13px;
            color: #1e293b;
            outline: none;
            min-width: 0;
        }

        .input-field::placeholder {
            color: #64748b;
        }

        .mic-btn {
            color: #475569;
        }

        .ai-mic-btn {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }

        .ai-mic-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Phone Status Bar -->
        <div class="status-bar">
            <span>8:17</span>
            <div class="right-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <span>19%</span>
            </div>
        </div>

        <!-- Top Navigation Bar -->
        <div class="top-nav">
            <button class="nav-item active" onclick="switchTab(this, 'Rooms')">
                <i class="fa-solid fa-house"></i>
                <span>Rooms</span>
            </button>
            <button class="nav-item" onclick="switchTab(this, 'Interior & Wall Design')">
                <i class="fa-solid fa-palette"></i>
                <span>Interior</span>
            </button>
            <button class="nav-item" onclick="switchTab(this, 'Furniture & Electronics')">
                <i class="fa-solid fa-couch"></i>
                <span>Furniture</span>
            </button>
            <button class="nav-item" onclick="switchTab(this, 'Swimming Pools')">
                <i class="fa-solid fa-water-ladder"></i>
                <span>Pools</span>
            </button>
            <button class="nav-item" onclick="switchTab(this, 'Car & Bike')">
                <i class="fa-solid fa-car"></i>
                <span>Car & Bike</span>
            </button>
            <button class="nav-item" onclick="switchTab(this, 'Settings')">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </button>
        </div>

        <!-- Dynamic Feedback Display -->
        <div id="feedbackText" class="content-display">Active Category: Rooms</div>

        <!-- Bottom Action / Input Bar -->
        <div class="bottom-bar">
            <button class="action-btn" onclick="triggerAction('plus')" title="Add Element">
                <i class="fa-solid fa-plus"></i>
            </button>
            <input type="text" id="dreamInput" class="input-field" placeholder="Type to make your dreams..." />
            <button class="action-btn mic-btn" onclick="triggerAction('mic')" title="Voice Input">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <button class="action-btn ai-mic-btn" onclick="triggerAction('ai-voice')" title="AI Assistant">
                <i class="fa-solid fa-wave-square"></i>
            </button>
        </div>
    </div>

    <script>
        function switchTab(buttonElement, categoryName) {
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            buttonElement.classList.add('active');
            
            const feedback = document.getElementById('feedbackText');
            feedback.innerText = `Switched to: ${categoryName}`;
        }

        function triggerAction(actionType) {
            const feedback = document.getElementById('feedbackText');
            const inputField = document.getElementById('dreamInput');

            if (actionType === 'plus') {
                feedback.innerText = "Action: Adding new element...";
            } else if (actionType === 'mic') {
                feedback.innerText = "Listening for voice command...";
                inputField.placeholder = "Listening...";
                setTimeout(() => {
                    inputField.placeholder = "Type to make your dreams...";
                }, 3000);
            } else if (actionType === 'ai-voice') {
                feedback.innerText = "AI Assistant activated!";
            }
        }

        const inputField = document.getElementById('dreamInput');
        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && inputField.value.trim() !== '') {
                const feedback = document.getElementById('feedbackText');
                feedback.innerText = `Processing: "${inputField.value}"`;
                inputField.value = '';
            }
        });
    </script>
</body>
</html>
