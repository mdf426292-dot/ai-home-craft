<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE OLD MONEY AI HOME CRAFT - INTERIOR GALLERY</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: #b8860b;
            font-size: 26px;
            margin-bottom: 5px;
        }
        .tagline {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        .gallery-item {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover {
            transform: scale(1.05);
        }
        .info-box {
            background-color: #fafafa;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 25px;
            line-height: 1.8;
            font-size: 15px;
            border: 1px solid #eee;
        }
        .lang-select {
            padding: 10px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            width: 100%;
            max-width: 350px;
            cursor: pointer;
        }
        .btn {
            background-color: #b8860b;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
            display: block;
            margin: 0 auto;
        }
        .btn:hover {
            background-color: #996e09;
        }
        @media (max-width: 600px) {
            .image-gallery {
                grid-template-columns: repeat(2, 1fr);
            }
            .gallery-item {
                height: 150px;
            }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>THE OLD MONEY AI HOME CRAFT</h1>
        <div class="tagline">20 PREMIUM INTERIOR DESIGNS GALLERY</div>
