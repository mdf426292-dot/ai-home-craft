!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE OLD MONEY AI HOME CRAFT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a1a1a;
            font-size: 26px;
            margin-bottom: 10px;
        }
        .tagline {
            color: #666;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .info-box {
            background-color: #f1f3f5;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 20px;
            line-height: 1.8;
            font-size: 15px;
            color: #222;
        }
        .lang-select {
            padding: 8px 12px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            width: 100%;
            max-width: 300px;
            cursor: pointer;
        }
        .btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
            display: block;
            margin: 0 auto;
        }
        .btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>THE OLD MONEY AI HOME CRAFT</h1>
        <div class="tagline">CLASSIC ELEGANCE MEETS MODERN AI TECHNOLOGY</div>
        
        <div>
            <label for="langPicker"><b>SELECT LANGUAGE (WORLD LANGUAGES):</b></label><br><br>
            <select id="langPicker" class="lang-select">
                <!-- Languages will load automatically -->
            </select>
        </div>

        <div class="info-box" id="speech-text">
            <b>NAME:</b> MD. FARHAN<br>
            <b>FATHER NAME:</b> ABDUL RAZZAK<br>
            <b>MOTHER NAME:</b> SHABANA PARVEEN<br>
            <b>ADDRESS:</b> MAHBUB CHOWK, GHORTHAMBHA, RAJDHANWAR, GIRIDIH, JHARKHAND
        </div>

        <button class="btn" onclick="speakText()">🔊 LISTEN TO WEBSITE</button>
    </div>

    <script>
        let voices = [];
        const langPicker = document.getElementById("langPicker");

        function populateVoiceList() {
            voices = window.speechSynthesis.getVoices();
            langPicker.innerHTML = "";
            
            voices.voices?.forEach?.((voice, index) => {}) || voices.forEach((voice, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                langPicker.appendChild(option);
            });
        }

        populateVoiceList();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        function speakText() {
            const text = document.getElementById("speech-text").innerText;
            const selectedIndex = langPicker.value;
            
            const speech = new SpeechSynthesisUtterance(text);
            if (voices[selectedIndex]) {
                speech.voice = voices[selectedIndex];
            }
            
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
