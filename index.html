HTML

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamSpace AI</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Arial, sans-serif;
}

.app {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  padding: 15px 12px;
  background:
    linear-gradient(#001d3530,#001d3520),
    url("background.jpg") center center / cover no-repeat;
}

/* Navigation */

.nav {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
  padding: 10px 5px;
  background: rgba(3,35,60,.85);
  border-radius: 25px;
  backdrop-filter: blur(15px);
}

.nav button {
  border: 1px solid transparent;
  border-radius: 16px;
  padding: 12px 2px;
  color: white;
  background: transparent;
  cursor: pointer;
  font-size: 11px;
}

.nav button.active {
  border-color: #00aaff;
  background: #087df544;
  box-shadow: 0 0 15px #008cff;
}

.nav button span {
  display: block;
  margin-top: 9px;
}

/* Full screen space */

.spacer {
  flex: 1;
}

/* Input area */

.input-box {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px;
  background: white;
  border-radius: 50px;
  margin-bottom: 12px;
  box-shadow: 0 5px 20px #00172c55;
}

.input-box input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  font-size: 15px;
  padding: 10px 0;
}

.input-box button {
  border: none;
  background: transparent;
  font-size: 25px;
  cursor: pointer;
  padding: 5px;
  flex-shrink: 0;
}

#send {
  background: #087df5;
  color: white;
  border-radius: 50%;
  width: 48px;
  height: 48px;
}

/* Mobile adjustments */

@media(max-width: 400px) {
  .nav {
    padding: 7px 3px;
  }

  .nav button {
    font-size: 9px;
    padding: 10px 1px;
  }

  .nav button span {
    margin-top: 7px;
  }

  .input-box {
    padding: 7px;
    gap: 3px;
  }

  .input-box input {
    font-size: 13px;
  }

  #send {
    width: 43px;
    height: 43px;
  }
}
</style>
</head>

<body>

<div class="app">

  <nav class="nav">

    <button class="active" onclick="choose(this,'Rooms')">
      🏠<span>Rooms</span>
    </button>

    <button onclick="choose(this,'Interior & Wall Design')">
      🎨<span>Interior & Wall Design</span>
    </button>

    <button onclick="choose(this,'Furniture & Electronics')">
      🛋️<span>Furniture & Electronics</span>
    </button>

    <button onclick="choose(this,'Swimming Pools')">
      🏊<span>Swimming Pools</span>
    </button>

    <button onclick="choose(this,'Car & Bike')">
      🚗<span>Car & Bike</span>
    </button>

    <button onclick="settings()">
      ⚙️<span>Settings</span>
    </button>

  </nav>

  <div class="spacer"></div>

  <div class="input-box">

    <button onclick="document.getElementById('image').click()">
      ＋
    </button>

    <input type="file" id="image" hidden accept="image/*">

    <input
      id="prompt"
      type="text"
      placeholder="Type to make your dreams"
    >

    <button onclick="voice()">🎙️</button>

    <button id="send" onclick="sendRequest()">
      ≋
    </button>

  </div>

</div>

<script>

function choose(button, category) {

  document.querySelectorAll('.nav button')
    .forEach(b => b.classList.remove('active'));

  button.classList.add('active');

  document.getElementById('prompt').placeholder =
    'Design my ' + category;
}

function settings() {
  alert('DreamSpace Settings');
}

function sendRequest() {

  const text = document.getElementById('prompt').value;

  if (!text.trim()) {
    alert('Please enter your design idea!');
    return;
  }

  alert('Your design request: ' + text);
}

function voice() {

  const Speech = window.SpeechRecognition ||
                 window.webkitSpeechRecognition;

  if (!Speech) {
    alert('Voice input is not supported.');
    return;
  }

  const recognition = new Speech();
  recognition.lang = 'en-IN';

  recognition.onresult = function(event) {
    document.getElementById('prompt').value =
      event.results[0][0].transcript;
  };

  recognition.start();
}

document.getElementById('image')
.addEventListener('change', function(event) {

  const file = event.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    document.querySelector('.app').style.backgroundImage =
      `url("${e.target.result}")`;
  };

  reader.readAsDataURL(file);

});

</script>

</body>
</html>
